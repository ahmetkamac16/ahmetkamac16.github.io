<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ahmet Kamaç</title>
  <meta name="description" content="Ahmet Kamaç — Software Developer" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark light" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "light" ? "#f5f5f7" : "#000000");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="bg-glow"></div>
    <div class="grain"></div>
  </div>

  <header class="nav-wrap">
    <nav class="nav glass" aria-label="Main">
      <a href="#top" class="brand" data-brand></a>
      <ul class="nav-links" data-nav></ul>
      <div class="nav-actions">
        <button class="lang-toggle" data-lang-toggle type="button">
          <span data-l="tr">TR</span><span data-l="en">EN</span>
          <i class="lang-thumb"></i>
        </button>
        <button class="icon-btn theme-toggle" data-theme-toggle type="button">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn menu-btn" data-menu type="button" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-inner reveal">
        <div class="hero-avatar" data-avatar></div>
        <p class="hero-greet" data-greeting></p>
        <h1 class="hero-name" data-name></h1>
        <p class="hero-role" data-role></p>
        <p class="hero-tagline" data-tagline></p>
        <div class="hero-cta">
          <a href="#experience" class="btn btn-primary" data-t="ctaWork"></a>
          <a href="#" class="btn btn-ghost" data-gh-hero target="_blank" rel="noopener"></a>
          <a href="#" class="btn btn-ghost" data-cv hidden download>
            <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-t="ctaSecondary"></span></a>
        </div>
      </div>
      <a href="#about" class="scroll-hint" aria-label="Scroll"><i></i></a>
    </section>

    <section id="about" class="section">
      <header class="section-head reveal" data-section="about"></header>
      <div class="glass card about-text reveal" data-about></div>
    </section>

    <section id="skills" class="section">
      <header class="section-head reveal" data-section="skills"></header>
      <div class="skills-grid" data-skills></div>
      <div class="glass card tools reveal">
        <p class="tools-title" data-t="alsoWork"></p>
        <div class="chips" data-tools></div>
      </div>
    </section>

    <section id="experience" class="section">
      <header class="section-head reveal" data-section="experience"></header>
      <ol class="timeline" data-experience></ol>
      <div data-education-wrap>
        <h3 class="sub-title reveal" data-section-title="education"></h3>
        <div class="edu-grid" data-education></div>
      </div>
    </section>

    <section id="repos" class="section">
      <div class="section-head-row">
        <header class="section-head reveal" data-section="repos"></header>
        <a class="btn btn-ghost btn-sm reveal" data-gh-profile target="_blank" rel="noopener"></a>
      </div>
      <div class="repos-grid" data-repos></div>
    </section>

    <section id="contact" class="section">
      <header class="section-head reveal" data-section="contact"></header>
      <div class="glass glass-xl contact-card reveal">
        <div class="contact-intro">
          <div class="contact-avatar" data-avatar></div>
          <h3 class="contact-name" data-name-plain></h3>
          <p class="contact-role" data-contact-role></p>
          <p class="contact-bio" data-contact-bio></p>
        </div>
        <ul class="contact-list" data-contact-list></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span data-year></span> <span data-name-plain></span>. <span data-t="rights"></span></p>
    <a href="#top" class="to-top"><span data-t="backTop"></span> ↑</a>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
